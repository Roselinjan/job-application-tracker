<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Job Application Tracker</title>
    <style>
    body {
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    margin: 0;
}

header {
    background: #1A56DB;
    color: white;
    padding: 18px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header a {
    color: white;
    text-decoration: none;
    font-weight: bold;
}

.container {
    max-width: 1200px;
    margin: 30px auto;
    padding: 0 20px;
}

.stats-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 20px;
    margin-bottom: 30px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

.card h3 {
    margin: 0;
    color: #555;
}

.card p {
    margin-top: 10px;
    font-size: 2rem;
    font-weight: bold;
    color: #1A56DB;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

th, td {
    padding: 14px;
    border-bottom: 1px solid #eee;
    text-align: left;
}

th {
    background: #1A56DB;
    color: white;
}

tr:hover {
    background: #f8f9ff;
}
</style>
</head>
<body>

    <header>
    <h1>Job Application Dashboard</h1>
    <a href="/index.html">← Back to Application Form</a>
</header>

<main class="container">

    <div style="margin-bottom:20px; display:flex; gap:10px;">
        <input
            type="email"
            id="emailInput"
            placeholder="Enter your email"
            value=""
            style="padding:10px; width:300px; border-radius:8px; border:1px solid #ccc;">

        <button onclick="loadDashboard()">
            Load Dashboard
        </button>
    </div>

    
        <section id="stats" class="stats-grid">

    <div class="card">
        <h3>Total</h3>
        <p id="totalCount">0</p>
    </div>

    <div class="card">
        <h3>Applied</h3>
        <p id="appliedCount">0</p>
    </div>

    <div class="card">
        <h3>Interview</h3>
        <p id="interviewCount">0</p>
    </div>

    <div class="card">
        <h3>Offered</h3>
        <p id="offeredCount">0</p>
    </div>

    <div class="card">
        <h3>Rejected</h3>
        <p id="rejectedCount">0</p>
    </div>

</section>
        <!-- Stats cards will go here -->


    <section>
        <h2>Recent Applications</h2>

        <table id="applicationsTable">
            <thead>
                <tr>
                    <th>Company</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th>Date Applied</th>
                </tr>
            </thead>

            <tbody>

            </tbody>
        </table>
    </section>

</main>
<script>
document.getElementById("emailInput").value = localStorage.getItem("userEmail") || "";
async function loadDashboard() {
    try {
        const email = document.getElementById("emailInput").value.trim() ||
        localStorage.getItem("userEmail");
        if (!email) {
        alert("Please enter your email.");
        return;
}

        const response = await fetch(
            `https://pu3jerpk0h.execute-api.ap-south-1.amazonaws.com/prod/dashboard?email=${encodeURIComponent(email)}`
        );

        const data = await response.json();

        document.getElementById("totalCount").textContent = data.stats.total;
        document.getElementById("appliedCount").textContent = data.stats.applied;
        document.getElementById("interviewCount").textContent = data.stats.interview;
        document.getElementById("offeredCount").textContent = data.stats.offered;
        document.getElementById("rejectedCount").textContent = data.stats.rejected;

        const tbody = document.querySelector("#applicationsTable tbody");
        tbody.innerHTML = "";

        data.applications.forEach(app => {
            tbody.innerHTML += `
                <tr>
                    <td>${app.company}</td>
                    <td>${app.role}</td>
                    <td>
                        <select onchange="updateStatus('${app.id}', this.value)">
                            <option value="Applied" ${app.status === "Applied" ? "selected" : ""}>Applied</option>
                            <option value="Interview" ${app.status === "Interview" ? "selected" : ""}>Interview</option>
                            <option value="Offered" ${app.status === "Offered" ? "selected" : ""}>Offered</option>
                            <option value="Rejected" ${app.status === "Rejected" ? "selected" : ""}>Rejected</option>
                        </select>
                    </td>
                    <td>${app.date}</td>
                </tr>
            `;
        });

    } catch (error) {
        console.error(error);
        alert("Failed to load dashboard");
    }
}

async function updateStatus(id, status) {
    try {
        const response = await fetch(
            `https://pu3jerpk0h.execute-api.ap-south-1.amazonaws.com/prod/applications/${id}`,
            {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ status })
            }
        );

        if (!response.ok) {
            throw new Error("Update failed");
        }

        loadDashboard();
    } catch (error) {
        console.error(error);
        alert("Failed to update status.");
    }
}

loadDashboard();

</script>
</body>
</html>
